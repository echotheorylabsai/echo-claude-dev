<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>secure-claude · Governance Audit Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

  :root {
    --bg-base: #0a0e14;
    --bg-surface: #111820;
    --bg-raised: #182030;
    --bg-hover: #1e2a3a;
    --border: #1e2a3a;
    --border-active: #2a3a50;
    --text-primary: #d4dce8;
    --text-secondary: #6e7f96;
    --text-muted: #3e4f66;
    --accent-green: #3dd68c;
    --accent-green-dim: rgba(61,214,140,.12);
    --accent-amber: #f0b429;
    --accent-amber-dim: rgba(240,180,41,.12);
    --accent-red: #ef4444;
    --accent-red-dim: rgba(239,68,68,.12);
    --accent-blue: #38bdf8;
    --accent-blue-dim: rgba(56,189,248,.12);
    --accent-purple: #a78bfa;
    --accent-purple-dim: rgba(167,139,250,.12);
    --accent-cyan: #22d3ee;
    --accent-cyan-dim: rgba(34,211,238,.12);
    --accent-orange: #fb923c;
    --accent-orange-dim: rgba(251,146,60,.12);
    --accent-magenta: #ec4899;
    --accent-magenta-dim: rgba(236,72,153,.12);
    --radius: 6px;
    --radius-lg: 10px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', system-ui, sans-serif;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.5), 0 12px 36px rgba(0,0,0,.35);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 14px; }

  body {
    font-family: var(--sans);
    background: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 3px; }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-cyan) 100%);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 20px rgba(61,214,140,.2);
  }
  .header-title {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: -.02em;
    color: var(--text-primary);
  }
  .header-title span { color: var(--text-muted); font-weight: 400; }
  .header-actions { display: flex; align-items: center; gap: 10px; }

  /* ── Buttons ── */
  .btn {
    font-family: var(--mono);
    font-size: .78rem;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-raised);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all .15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-active); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-cyan) 100%);
    color: var(--bg-base);
    border-color: transparent;
    font-weight: 600;
  }
  .btn-primary:hover { opacity: .9; color: var(--bg-base); }

  /* ── Landing / Drop zone ── */
  .landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 65px);
    padding: 40px;
    text-align: center;
  }
  .landing.hidden { display: none; }
  .drop-zone {
    width: 480px;
    max-width: 100%;
    padding: 56px 40px;
    border: 2px dashed var(--border-active);
    border-radius: var(--radius-lg);
    background: var(--bg-surface);
    transition: all .2s ease;
    cursor: pointer;
  }
  .drop-zone.drag-over {
    border-color: var(--accent-green);
    background: rgba(61,214,140,.04);
    box-shadow: 0 0 40px rgba(61,214,140,.08);
  }
  .drop-zone-icon {
    font-size: 36px;
    margin-bottom: 16px;
    opacity: .6;
  }
  .drop-zone-title {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .drop-zone-hint {
    color: var(--text-secondary);
    font-size: .85rem;
    margin-bottom: 20px;
  }
  .drop-zone code {
    font-family: var(--mono);
    font-size: .78rem;
    background: var(--bg-raised);
    padding: 2px 8px;
    border-radius: 3px;
    color: var(--text-secondary);
  }

  /* ── Dashboard shell ── */
  .dashboard { display: none; }
  .dashboard.active { display: block; }
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 20px 24px 32px;
    max-width: 1440px;
    margin: 0 auto;
  }

  /* ── KPI row ── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  .kpi-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    transition: border-color .15s ease;
  }
  .kpi-card:hover { border-color: var(--border-active); }
  .kpi-label {
    font-family: var(--mono);
    font-size: .7rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 6px;
  }
  .kpi-value {
    font-family: var(--mono);
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.1;
  }
  .kpi-sub {
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .kpi-value.green { color: var(--accent-green); }
  .kpi-value.amber { color: var(--accent-amber); }
  .kpi-value.red { color: var(--accent-red); }
  .kpi-value.blue { color: var(--accent-blue); }
  .kpi-value.purple { color: var(--accent-purple); }
  .kpi-value.cyan { color: var(--accent-cyan); }

  /* ── Panels ── */
  .panel {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-family: var(--mono);
    font-size: .82rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-body { padding: 16px 18px; }

  /* ── Charts row ── */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 960px) { .charts-row { grid-template-columns: 1fr; } }

  /* ── Bar chart ── */
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label {
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--text-secondary);
    width: 120px;
    text-align: right;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    flex: 1;
    height: 20px;
    background: var(--bg-base);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width .6s cubic-bezier(.22,1,.36,1);
    min-width: 2px;
  }
  .bar-count {
    font-family: var(--mono);
    font-size: .72rem;
    font-weight: 600;
    width: 36px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ── Severity dots ── */
  .severity-chart { display: flex; flex-direction: column; gap: 8px; }
  .severity-row { display: flex; align-items: center; gap: 8px; }
  .severity-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .severity-label {
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--text-secondary);
    flex: 1;
  }
  .severity-value {
    font-family: var(--mono);
    font-size: .78rem;
    font-weight: 600;
  }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-chip {
    font-family: var(--mono);
    font-size: .72rem;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--border-active); color: var(--text-primary); }
  .filter-chip.active {
    background: var(--accent-blue-dim);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }
  .filter-chip .count {
    opacity: .6;
    margin-left: 4px;
  }
  .search-input {
    font-family: var(--mono);
    font-size: .78rem;
    padding: 5px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-base);
    color: var(--text-primary);
    outline: none;
    width: 220px;
    transition: border-color .15s ease;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--accent-blue); }

  /* ── Event log table ── */
  .event-table-wrap { overflow-x: auto; }
  .event-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .78rem;
  }
  .event-table th {
    font-family: var(--mono);
    font-weight: 600;
    font-size: .7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg-surface);
    z-index: 2;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .event-table th:hover { color: var(--text-secondary); }
  .event-table th .sort-arrow { margin-left: 4px; opacity: .4; }
  .event-table th.sorted .sort-arrow { opacity: 1; color: var(--accent-blue); }
  .event-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--text-secondary);
  }
  .event-table tbody tr { transition: background .1s ease; }
  .event-table tbody tr:hover { background: var(--bg-hover); }
  .event-table tbody tr.expanded { background: var(--bg-raised); }

  /* ── Event badges ── */
  .badge {
    font-family: var(--mono);
    font-size: .68rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 3px;
    display: inline-block;
    white-space: nowrap;
  }
  .badge-session-start { background: var(--accent-blue-dim); color: var(--accent-blue); }
  .badge-session-end { background: var(--accent-purple-dim); color: var(--accent-purple); }
  .badge-prompt-scanned { background: var(--accent-green-dim); color: var(--accent-green); }
  .badge-threat-detected { background: var(--accent-red-dim); color: var(--accent-red); }
  .badge-pre-tool-use { background: var(--accent-cyan-dim); color: var(--accent-cyan); }
  .badge-pre-tool-decision { background: var(--accent-amber-dim); color: var(--accent-amber); }
  .badge-post-tool-scanned { background: var(--accent-green-dim); color: var(--accent-green); }
  .badge-indirect-threat { background: var(--accent-magenta-dim); color: var(--accent-magenta); }
  .badge-config-error { background: var(--accent-orange-dim); color: var(--accent-orange); }
  /* New lifecycle event types — secure-claude additions */
  .badge-subagent-stop { background: var(--accent-purple-dim); color: var(--accent-purple); }
  .badge-pre-compact { background: var(--accent-cyan-dim); color: var(--accent-cyan); }
  .badge-notification { background: var(--accent-blue-dim); color: var(--accent-blue); }
  .badge-turn-stop { background: var(--accent-amber-dim); color: var(--accent-amber); }
  .badge-allow { background: var(--accent-green-dim); color: var(--accent-green); }
  .badge-deny { background: var(--accent-red-dim); color: var(--accent-red); }

  /* ── Detail row ── */
  .detail-row td {
    padding: 0 !important;
    border-bottom: 1px solid var(--border);
  }
  .detail-content {
    padding: 12px 16px 12px 48px;
    background: var(--bg-base);
    border-top: 1px solid var(--border);
  }
  .detail-json {
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
    max-height: 280px;
    overflow-y: auto;
  }
  .detail-json .key { color: var(--accent-blue); }
  .detail-json .string { color: var(--accent-green); }
  .detail-json .number { color: var(--accent-amber); }
  .detail-json .bool { color: var(--accent-purple); }
  .detail-json .null { color: var(--text-muted); }

  /* ── Timeline mini ── */
  .timeline-strip {
    display: flex;
    align-items: flex-end;
    gap: 1px;
    height: 48px;
    padding: 0;
  }
  .timeline-bar {
    flex: 1;
    min-width: 2px;
    border-radius: 1px 1px 0 0;
    transition: height .4s cubic-bezier(.22,1,.36,1), opacity .15s ease;
    cursor: pointer;
    position: relative;
  }
  .timeline-bar:hover { opacity: .75; }

  /* ── Pagination ── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--text-secondary);
  }
  .pagination-controls { display: flex; gap: 6px; }
  .page-btn {
    font-family: var(--mono);
    font-size: .72rem;
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all .15s ease;
  }
  .page-btn:hover { border-color: var(--border-active); color: var(--text-primary); }
  .page-btn:disabled { opacity: .3; cursor: not-allowed; }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn .35s ease-out both; }
  .fade-in-1 { animation-delay: .05s; }
  .fade-in-2 { animation-delay: .1s; }
  .fade-in-3 { animation-delay: .15s; }
  .fade-in-4 { animation-delay: .2s; }
  .fade-in-5 { animation-delay: .25s; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .dashboard-grid { padding: 12px 12px 24px; }
    .kpi-row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .header { padding: 12px 16px; }
    .search-input { width: 160px; }
  }

  /* ── Noise texture overlay ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: .025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="header">
  <div class="header-left">
    <div class="header-logo">🛡️</div>
    <div class="header-title">secure-claude <span>/ governance audit</span></div>
  </div>
  <div class="header-actions">
    <button class="btn" id="btn-load" title="Load .jsonl file">⬆ Load Log</button>
    <button class="btn" id="btn-export" title="Export filtered events as JSON" style="display:none">⬇ Export</button>
  </div>
</header>

<!-- ── Landing ── -->
<div class="landing" id="landing">
  <div class="drop-zone" id="drop-zone">
    <div class="drop-zone-icon">📂</div>
    <div class="drop-zone-title">Drop governance-audit.jsonl here</div>
    <div class="drop-zone-hint">or click to browse</div>
    <code>~/progress-ai/secure-claude/logs/&lt;project&gt;/governance-audit.jsonl</code>
  </div>
  <input type="file" id="file-input" accept=".jsonl,.json,.log" hidden>
</div>

<!-- ── Dashboard ── -->
<div class="dashboard" id="dashboard">
  <div class="dashboard-grid">

    <!-- KPIs -->
    <div class="kpi-row fade-in fade-in-1" id="kpi-row"></div>

    <!-- Timeline strip -->
    <div class="panel fade-in fade-in-2">
      <div class="panel-header">
        <div class="panel-title">📊 Event Timeline</div>
        <div style="font-family:var(--mono);font-size:.68rem;color:var(--text-muted)" id="timeline-range"></div>
      </div>
      <div class="panel-body" style="padding:12px 18px 8px">
        <div class="timeline-strip" id="timeline-strip"></div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-row fade-in fade-in-3">
      <div class="panel">
        <div class="panel-header"><div class="panel-title">📋 Event Types</div></div>
        <div class="panel-body" id="chart-events"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><div class="panel-title">⚖️ Tool Decisions</div></div>
        <div class="panel-body" id="chart-decisions"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><div class="panel-title">🎯 Threat Categories</div></div>
        <div class="panel-body" id="chart-threats"></div>
      </div>
    </div>

    <!-- Event log -->
    <div class="panel fade-in fade-in-4">
      <div class="panel-header">
        <div class="panel-title">📜 Event Log</div>
        <div class="filter-bar" id="filter-bar">
          <input type="text" class="search-input" id="search-input" placeholder="Search events...">
        </div>
      </div>
      <div class="event-table-wrap" style="max-height:520px;overflow-y:auto">
        <table class="event-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

  </div>
</div>

<script>
(function() {
  'use strict';

  // ── State ──
  let allEvents = [];
  let filteredEvents = [];
  let activeFilters = new Set();
  let searchQuery = '';
  let sortField = 'index';
  let sortDir = 'asc';
  let currentPage = 1;
  const PAGE_SIZE = 50;
  let expandedRows = new Set();

  // ── DOM refs ──
  const $ = id => document.getElementById(id);
  const landing = $('landing');
  const dashboard = $('dashboard');
  const fileInput = $('file-input');
  const dropZone = $('drop-zone');
  const btnLoad = $('btn-load');
  const btnExport = $('btn-export');
  const searchInput = $('search-input');

  // ── Event colors ──
  const EVENT_COLORS = {
    sessionStart: { bg: 'var(--accent-blue-dim)', fg: 'var(--accent-blue)', cls: 'badge-session-start', bar: 'var(--accent-blue)' },
    sessionEnd: { bg: 'var(--accent-purple-dim)', fg: 'var(--accent-purple)', cls: 'badge-session-end', bar: 'var(--accent-purple)' },
    promptScanned: { bg: 'var(--accent-green-dim)', fg: 'var(--accent-green)', cls: 'badge-prompt-scanned', bar: 'var(--accent-green)' },
    threatDetected: { bg: 'var(--accent-red-dim)', fg: 'var(--accent-red)', cls: 'badge-threat-detected', bar: 'var(--accent-red)' },
    preToolUse: { bg: 'var(--accent-cyan-dim)', fg: 'var(--accent-cyan)', cls: 'badge-pre-tool-use', bar: 'var(--accent-cyan)' },
    preToolDecision: { bg: 'var(--accent-amber-dim)', fg: 'var(--accent-amber)', cls: 'badge-pre-tool-decision', bar: 'var(--accent-amber)' },
    configError: { bg: 'var(--accent-orange-dim)', fg: 'var(--accent-orange)', cls: 'badge-config-error', bar: 'var(--accent-orange)' },
    postToolScanned: { bg: 'var(--accent-green-dim)', fg: 'var(--accent-green)', cls: 'badge-post-tool-scanned', bar: 'var(--accent-green)' },
    indirectThreatDetected: { bg: 'var(--accent-magenta-dim)', fg: 'var(--accent-magenta)', cls: 'badge-indirect-threat', bar: 'var(--accent-magenta)' },
    // Lifecycle event types — secure-claude additions (subagentStop, preCompact, notification, turnStop)
    // The dashboard auto-discovers any other event types from the loaded JSONL and renders them
    // without custom coloring (fallback to text-muted) — no code changes needed for unknown types.
    subagentStop: { bg: 'var(--accent-purple-dim)', fg: 'var(--accent-purple)', cls: 'badge-subagent-stop', bar: 'var(--accent-purple)' },
    preCompact: { bg: 'var(--accent-cyan-dim)', fg: 'var(--accent-cyan)', cls: 'badge-pre-compact', bar: 'var(--accent-cyan)' },
    notification: { bg: 'var(--accent-blue-dim)', fg: 'var(--accent-blue)', cls: 'badge-notification', bar: 'var(--accent-blue)' },
    turnStop: { bg: 'var(--accent-amber-dim)', fg: 'var(--accent-amber)', cls: 'badge-turn-stop', bar: 'var(--accent-amber)' },
  };

  // ── File loading ──
  btnLoad.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files.length) loadFile(fileInput.files[0]); });

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = () => parseAndRender(reader.result);
    reader.readAsText(file);
  }

  function parseAndRender(text) {
    const lines = text.trim().split('\n').filter(Boolean);
    allEvents = [];
    for (let i = 0; i < lines.length; i++) {
      try {
        const obj = JSON.parse(lines[i]);
        obj._index = i;
        allEvents.push(obj);
      } catch (e) { /* skip malformed lines */ }
    }
    if (!allEvents.length) { alert('No valid JSONL events found in file.'); return; }

    landing.classList.add('hidden');
    dashboard.classList.add('active');
    btnExport.style.display = '';

    activeFilters.clear();
    searchQuery = '';
    searchInput.value = '';
    currentPage = 1;
    expandedRows.clear();
    sortField = 'index';
    sortDir = 'asc';

    applyFilters();
    renderKPIs();
    renderTimeline();
    renderCharts();
    renderFilterChips();
    renderTable();
  }

  // ── Filtering ──
  function applyFilters() {
    filteredEvents = allEvents.filter(ev => {
      if (activeFilters.size && !activeFilters.has(ev.event)) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const haystack = JSON.stringify(ev).toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });
    sortEvents();
  }

  function sortEvents() {
    filteredEvents.sort((a, b) => {
      let va, vb;
      switch (sortField) {
        case 'index': va = a._index; vb = b._index; break;
        case 'timestamp': va = a.timestamp || ''; vb = b.timestamp || ''; break;
        case 'event': va = a.event || ''; vb = b.event || ''; break;
        case 'tool': va = a.tool || ''; vb = b.tool || ''; break;
        case 'decision': va = a.decision || ''; vb = b.decision || ''; break;
        default: va = a._index; vb = b._index;
      }
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    currentPage = 1;
    applyFilters();
    renderTable();
  });

  // ── KPIs ──
  function renderKPIs() {
    const total = allEvents.length;
    const threats = allEvents.filter(e => e.event === 'threatDetected').length;
    const denies = allEvents.filter(e => e.event === 'preToolDecision' && e.decision === 'deny').length;
    const allows = allEvents.filter(e => e.event === 'preToolDecision' && e.decision === 'allow').length;
    const prompts = allEvents.filter(e => e.event === 'promptScanned' || e.event === 'threatDetected').length;
    const errors = allEvents.filter(e => e.event === 'configError').length;

    const maxSev = allEvents
      .filter(e => e.event === 'threatDetected')
      .reduce((max, e) => Math.max(max, e.max_severity || 0), 0);

    const indirectThreats = allEvents.filter(e => e.event === 'indirectThreatDetected').length;
    const indirectMaxSev = allEvents.filter(e => e.event === 'indirectThreatDetected')
      .reduce((max, e) => Math.max(max, e.max_severity || 0), 0);

    const kpis = [
      { label: 'Total Events', value: total, color: 'blue', sub: `${filteredEvents.length} shown` },
      { label: 'Threats', value: threats, color: threats > 0 ? 'red' : 'green', sub: maxSev > 0 ? `max severity: ${maxSev.toFixed(2)}` : 'none detected' },
      { label: 'Indirect Threats', value: indirectThreats, color: indirectThreats > 0 ? 'red' : 'green', sub: indirectMaxSev > 0 ? `max severity: ${indirectMaxSev.toFixed(2)}` : 'none detected' },
      { label: 'Denies', value: denies, color: denies > 0 ? 'amber' : 'green', sub: `${allows} allowed` },
      { label: 'Prompts Scanned', value: prompts, color: 'cyan', sub: `${prompts - threats} clean` },
      { label: 'Config Errors', value: errors, color: errors > 0 ? 'red' : 'green', sub: errors > 0 ? 'review recommended' : 'all clear' },
    ];

    $('kpi-row').innerHTML = kpis.map(k => `
      <div class="kpi-card">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value ${k.color}">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
      </div>
    `).join('');
  }

  // ── Timeline ──
  function renderTimeline() {
    const strip = $('timeline-strip');
    const rangeEl = $('timeline-range');
    if (!allEvents.length) { strip.innerHTML = ''; return; }

    const bucketCount = Math.min(allEvents.length, 80);
    const bucketSize = Math.ceil(allEvents.length / bucketCount);
    const buckets = [];

    for (let i = 0; i < bucketCount; i++) {
      const slice = allEvents.slice(i * bucketSize, (i + 1) * bucketSize);
      const counts = {};
      for (const ev of slice) {
        counts[ev.event] = (counts[ev.event] || 0) + 1;
      }
      buckets.push({ counts, total: slice.length, start: slice[0], end: slice[slice.length - 1] });
    }

    const maxTotal = Math.max(...buckets.map(b => b.total), 1);
    const timestamps = allEvents.filter(e => e.timestamp).map(e => e.timestamp);
    if (timestamps.length >= 2) {
      rangeEl.textContent = `${timestamps[0]} → ${timestamps[timestamps.length - 1]}`;
    }

    strip.innerHTML = buckets.map((b, i) => {
      const height = Math.max(4, (b.total / maxTotal) * 48);
      const dominant = Object.entries(b.counts).sort((a, b) => b[1] - a[1])[0];
      const color = (EVENT_COLORS[dominant[0]] || {}).bar || 'var(--text-muted)';
      const title = Object.entries(b.counts).map(([k, v]) => `${k}: ${v}`).join('\n');
      return `<div class="timeline-bar" style="height:${height}px;background:${color}" title="${title}"></div>`;
    }).join('');
  }

  // ── Charts ──
  function renderCharts() {
    renderEventTypeChart();
    renderDecisionChart();
    renderThreatChart();
  }

  function renderBarChart(container, data, colorFn) {
    const maxVal = Math.max(...data.map(d => d.count), 1);
    container.innerHTML = `<div class="bar-chart">${data.map(d => {
      const pct = (d.count / maxVal) * 100;
      const color = colorFn(d.label);
      return `<div class="bar-row">
        <div class="bar-label" title="${d.label}">${d.label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="bar-count" style="color:${color}">${d.count}</div>
      </div>`;
    }).join('')}</div>`;
  }

  function renderEventTypeChart() {
    const counts = {};
    for (const ev of allEvents) counts[ev.event] = (counts[ev.event] || 0) + 1;
    const data = Object.entries(counts)
      .map(([label, count]) => ({ label, count }))
      .sort((a, b) => b.count - a.count);
    renderBarChart($('chart-events'), data, label => (EVENT_COLORS[label] || {}).fg || 'var(--text-muted)');
  }

  function renderDecisionChart() {
    const decisions = allEvents.filter(e => e.event === 'preToolDecision');
    const byTool = {};
    for (const ev of decisions) {
      const key = `${ev.tool} · ${ev.decision}`;
      byTool[key] = (byTool[key] || 0) + 1;
    }
    const data = Object.entries(byTool)
      .map(([label, count]) => ({ label, count }))
      .sort((a, b) => b.count - a.count);
    renderBarChart($('chart-decisions'), data, label => {
      if (label.includes('deny')) return 'var(--accent-red)';
      if (label.includes('allow')) return 'var(--accent-green)';
      return 'var(--text-muted)';
    });
  }

  function renderThreatChart() {
    const threats = allEvents.filter(e => e.event === 'threatDetected' || e.event === 'indirectThreatDetected');
    const cats = {};
    for (const ev of threats) {
      for (const t of (ev.threats || [])) {
        const key = t.category || 'unknown';
        if (!cats[key]) cats[key] = { count: 0, maxSev: 0 };
        cats[key].count++;
        cats[key].maxSev = Math.max(cats[key].maxSev, t.severity || 0);
      }
    }
    const container = $('chart-threats');
    if (!Object.keys(cats).length) {
      container.innerHTML = '<div style="color:var(--accent-green);font-family:var(--mono);font-size:.78rem">✅ No threats detected</div>';
      return;
    }

    const sevColor = s => s >= 0.9 ? 'var(--accent-red)' : s >= 0.7 ? 'var(--accent-amber)' : 'var(--accent-blue)';

    container.innerHTML = `<div class="severity-chart">${Object.entries(cats)
      .sort((a, b) => b[1].maxSev - a[1].maxSev)
      .map(([cat, info]) => `<div class="severity-row">
        <div class="severity-dot" style="background:${sevColor(info.maxSev)}"></div>
        <div class="severity-label">${cat.replace(/_/g, ' ')}</div>
        <div class="severity-value" style="color:${sevColor(info.maxSev)}">${info.count}× (${info.maxSev.toFixed(2)})</div>
      </div>`).join('')}</div>`;
  }

  // ── Filter chips ──
  function renderFilterChips() {
    const counts = {};
    for (const ev of allEvents) counts[ev.event] = (counts[ev.event] || 0) + 1;
    const bar = $('filter-bar');
    const chips = Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .map(([event, count]) => {
        const active = activeFilters.has(event);
        return `<button class="filter-chip ${active ? 'active' : ''}" data-event="${event}">${event}<span class="count">${count}</span></button>`;
      }).join('');
    // Keep search input, replace chips
    bar.innerHTML = `<input type="text" class="search-input" id="search-input" placeholder="Search events..." value="${searchQuery}">` + chips;

    // Re-bind
    const newSearch = bar.querySelector('.search-input');
    newSearch.addEventListener('input', () => {
      searchQuery = newSearch.value;
      currentPage = 1;
      applyFilters();
      renderTable();
    });

    bar.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const event = chip.dataset.event;
        if (activeFilters.has(event)) activeFilters.delete(event);
        else activeFilters.add(event);
        currentPage = 1;
        applyFilters();
        renderFilterChips();
        renderTable();
      });
    });
  }

  // ── Table ──
  const COLUMNS = [
    { key: 'index', label: '#', width: '48px' },
    { key: 'timestamp', label: 'Timestamp', width: '180px' },
    { key: 'event', label: 'Event', width: '150px' },
    { key: 'tool', label: 'Tool', width: '80px' },
    { key: 'decision', label: 'Decision', width: '90px' },
    { key: 'detail', label: 'Detail', width: 'auto' },
  ];

  function renderTableHead() {
    $('table-head').innerHTML = `<tr>${COLUMNS.map(col =>
      `<th style="width:${col.width}" class="${sortField === col.key ? 'sorted' : ''}" data-sort="${col.key}">
        ${col.label}<span class="sort-arrow">${sortField === col.key ? (sortDir === 'asc' ? '↑' : '↓') : '↕'}</span>
      </th>`
    ).join('')}</tr>`;

    $('table-head').querySelectorAll('th').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (key === 'detail') return;
        if (sortField === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else { sortField = key; sortDir = 'asc'; }
        applyFilters();
        renderTable();
      });
    });
  }

  function getDetail(ev) {
    switch (ev.event) {
      case 'sessionStart': return `cwd: ${ev.cwd || '—'}`;
      case 'sessionEnd': return `${ev.total_events || 0} events, ${ev.threats_detected || 0} threats`;
      case 'promptScanned': return `status: ${ev.status || '—'}`;
      case 'threatDetected': {
        const t = (ev.threats || []);
        return t.map(th => `[${th.category}] ${th.description} (${th.severity})`).join('; ') || '—';
      }
      case 'preToolUse': {
        const cmd = ev.args?.command;
        const path = ev.args?.path;
        return cmd ? `$ ${cmd}` : path ? `path: ${path}` : '—';
      }
      case 'preToolDecision': return ev.reason || '(no reason)';
      case 'postToolScanned': return `tool: ${ev.tool || '—'}, status: ${ev.status || '—'}`;
      case 'indirectThreatDetected': {
        const t = (ev.threats || []);
        return t.map(th => `[${th.category}] ${th.description} (${th.severity})`).join('; ') || '—';
      }
      case 'configError': return ev.message || '—';
      // Lifecycle events — secure-claude additions
      case 'subagentStop': return `subagent_id: ${ev.subagent_id || ev.session_id || '—'}`;
      case 'preCompact': return `context_tokens: ${ev.context_tokens != null ? ev.context_tokens : '—'}`;
      case 'notification': return ev.message || ev.content || '—';
      case 'turnStop': return `turn: ${ev.turn != null ? ev.turn : '—'}`;
      default: return '—';
    }
  }

  function renderTable() {
    renderTableHead();
    const totalPages = Math.ceil(filteredEvents.length / PAGE_SIZE) || 1;
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * PAGE_SIZE;
    const page = filteredEvents.slice(start, start + PAGE_SIZE);

    const body = $('table-body');
    let html = '';
    for (const ev of page) {
      const ec = EVENT_COLORS[ev.event] || {};
      const expanded = expandedRows.has(ev._index);
      const detailText = getDetail(ev);
      const truncDetail = detailText.length > 90 ? detailText.slice(0, 90) + '…' : detailText;

      let decisionBadge = '';
      if (ev.decision === 'allow') decisionBadge = '<span class="badge badge-allow">allow</span>';
      else if (ev.decision === 'deny') decisionBadge = '<span class="badge badge-deny">deny</span>';

      html += `<tr class="${expanded ? 'expanded' : ''}" data-idx="${ev._index}" style="cursor:pointer">
        <td style="color:var(--text-muted)">${ev._index + 1}</td>
        <td>${ev.timestamp || '—'}</td>
        <td><span class="badge ${ec.cls || ''}">${ev.event}</span></td>
        <td>${ev.tool || ''}</td>
        <td>${decisionBadge}</td>
        <td title="${esc(detailText)}">${esc(truncDetail)}</td>
      </tr>`;
      if (expanded) {
        html += `<tr class="detail-row"><td colspan="6"><div class="detail-content"><div class="detail-json">${syntaxHighlight(ev)}</div></div></td></tr>`;
      }
    }
    body.innerHTML = html;

    body.querySelectorAll('tr:not(.detail-row)').forEach(tr => {
      tr.addEventListener('click', () => {
        const idx = parseInt(tr.dataset.idx, 10);
        if (expandedRows.has(idx)) expandedRows.delete(idx);
        else expandedRows.add(idx);
        renderTable();
      });
    });

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    $('pagination').innerHTML = `
      <span>Showing ${filteredEvents.length ? ((currentPage - 1) * PAGE_SIZE + 1) : 0}–${Math.min(currentPage * PAGE_SIZE, filteredEvents.length)} of ${filteredEvents.length}</span>
      <div class="pagination-controls">
        <button class="page-btn" id="page-prev" ${currentPage <= 1 ? 'disabled' : ''}>← Prev</button>
        <span style="padding:0 8px">${currentPage} / ${totalPages}</span>
        <button class="page-btn" id="page-next" ${currentPage >= totalPages ? 'disabled' : ''}>Next →</button>
      </div>`;
    $('page-prev')?.addEventListener('click', () => { currentPage--; renderTable(); });
    $('page-next')?.addEventListener('click', () => { currentPage++; renderTable(); });
  }

  // ── Helpers ──
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function syntaxHighlight(obj) {
    const json = JSON.stringify(obj, null, 2);
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g, match => {
      let cls = 'number';
      if (/^"/.test(match)) {
        cls = /:$/.test(match) ? 'key' : 'string';
      } else if (/true|false/.test(match)) {
        cls = 'bool';
      } else if (/null/.test(match)) {
        cls = 'null';
      }
      return `<span class="${cls}">${esc(match)}</span>`;
    });
  }

  // ── Export ──
  btnExport.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(filteredEvents, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'governance-audit-filtered.json';
    a.click();
    URL.revokeObjectURL(url);
  });

})();
</script>
</body>
</html>
